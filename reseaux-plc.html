<!doctype html>
<html lang="fr" data-astryx-theme="neutral">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Les réseaux de communication dans les automates (PLC)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@astryxdesign/core@0.7.17/src/reset.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@astryxdesign/core@0.7.17/dist/astryx.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@astryxdesign/theme-neutral@0.7.17/dist/theme.css" />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.2.0",
          "react/jsx-runtime": "https://esm.sh/react@19.2.0/jsx-runtime",
          "react-dom": "https://esm.sh/react-dom@19.2.0",
          "react-dom/client": "https://esm.sh/react-dom@19.2.0/client",
          "htm": "https://esm.sh/htm@3.1.1",
          "@astryxdesign/core": "https://esm.sh/@astryxdesign/core@0.7.17?external=react,react-dom",
          "@astryxdesign/theme-neutral": "https://esm.sh/@astryxdesign/theme-neutral@0.7.17?external=react,react-dom"
        }
      }
    </script>
    <style>
      body { font-family: var(--font-family-body); }
      #root:empty::after { content: 'Chargement de la page…'; display: block; padding: 2rem; color: var(--color-text-secondary); }
      .fig { width: 100%; height: auto; display: block; color: var(--color-text-primary); }
      .fig text { font-family: var(--font-family-body); fill: currentColor; }
      .fig .muted { fill: var(--color-text-secondary); }
      .fig .wire { stroke: currentColor; fill: none; stroke-width: 1.6; }
      .fig .box { fill: none; stroke: currentColor; stroke-width: 1.6; }
      .fig .plc { fill: #2563eb; stroke: none; }
      .fig .dev { fill: #16a34a; stroke: none; }
      .fig .sw { fill: #7c3aed; stroke: none; }
      .fig .hl { fill: #ea580c; stroke: none; }
      .fig .white { fill: #fff; }
      .fig .lvl { cursor: pointer; transition: opacity .2s; }
      .fig .lvl.dim { opacity: .35; }
      @keyframes token { 0% { offset-distance: 0%; } 100% { offset-distance: 100%; } }
      .token { offset-path: path('M 90 60 L 330 60 L 570 60 L 330 60 Z'); animation: token 6s linear infinite; }
      @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .15; } }
      .blink { animation: blink 1.2s ease-in-out infinite; }
      @keyframes dash { to { stroke-dashoffset: -40; } }
      .flow { stroke-dasharray: 6 6; animation: dash 1.5s linear infinite; }
      .nowrap { white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import * as React from 'react';
      import {createRoot} from 'react-dom/client';
      import htm from 'htm';
      import {Theme, Stack, HStack, Grid, Card, Section, Heading, Text, Button, Badge, Banner, Collapsible, Divider, TabList, Tab, Table} from '@astryxdesign/core';
      import {neutralTheme} from '@astryxdesign/theme-neutral';
      const h = htm.bind(React.createElement);
      const {useState} = React;

      // ---------- Petits blocs réutilisables ----------
      const Puces = ({items}) => h`<${Stack} gap=${1} align="start">${items.map((t, i) => h`<${Text} key=${i}>• ${t}</${Text}>`)}</${Stack}>`;
      const Titre = ({n, children}) => h`
        <${HStack} gap=${2} align="center">
          <${Badge} variant="blue" label=${String(n)} />
          <${Heading} level=${2}>${children}</${Heading}>
        </${HStack}>`;

      // ---------- Figures (SVG) ----------
      function FigCablage() {
        const dev = [40, 85, 130, 175, 220, 265];
        return h`<svg class="fig" viewBox="0 0 640 300" role="img" aria-label="Câblage conventionnel contre réseau">
          <text x="150" y="22" textAnchor="middle" fontWeight="600" fontSize="14">Câblage conventionnel</text>
          <rect class="plc" x="120" y="40" width="60" height="60" rx="6"/><text x="150" y="75" textAnchor="middle" fontSize="12" class="white">API</text>
          ${dev.map((y, i) => h`<g key=${i}>
            <line class="wire" x1=${125 + i * 10} y1="100" x2=${125 + i * 10} y2=${y + 150 - 80} />
            <line class="wire" x1=${125 + i * 10} y1=${y + 150 - 80} x2=${30 + i * 48} y2=${y + 150 - 80} />
            <line class="wire" x1=${30 + i * 48} y1=${y + 150 - 80} x2=${30 + i * 48} y2="250" />
            <circle class="dev" cx=${30 + i * 48} cy="258" r="9" />
          </g>`)}
          <text x="150" y="290" textAnchor="middle" fontSize="12" class="muted">1 capteur = 1 ou 2 fils jusqu'à l'armoire</text>
          <line x1="320" y1="20" x2="320" y2="285" stroke="currentColor" strokeDasharray="4 4" opacity=".4"/>
          <text x="480" y="22" textAnchor="middle" fontWeight="600" fontSize="14">Réseau (bus de terrain)</text>
          <rect class="plc" x="450" y="40" width="60" height="60" rx="6"/><text x="480" y="75" textAnchor="middle" fontSize="12" class="white">API</text>
          <line class="wire" x1="480" y1="100" x2="480" y2="200" strokeWidth="3"/>
          <line class="wire flow" x1="350" y1="200" x2="610" y2="200" strokeWidth="3"/>
          ${[360, 408, 456, 504, 552, 600].map((x, i) => h`<g key=${i}>
            <line class="wire" x1=${x} y1="200" x2=${x} y2="245" />
            <circle class="dev" cx=${x} cy="256" r="9" />
          </g>`)}
          <text x="480" y="290" textAnchor="middle" fontSize="12" class="muted">1 seul câble (données + alimentation), des dérivations</text>
        </svg>`;
      }

      function FigPyramide({sel, onSel}) {
        const L = [
          {k: 'info', y: 20, w: 200, label: 'Niveau information', sub: 'Bureaux, ERP, serveurs', c: '#7c3aed'},
          {k: 'ctrl', y: 100, w: 340, label: 'Niveau contrôle', sub: 'API, contrôleurs de robots, IHM', c: '#2563eb'},
          {k: 'dev', y: 180, w: 480, label: 'Niveau terrain (device)', sub: 'Capteurs, boutons, vannes, variateurs', c: '#16a34a'},
        ];
        return h`<svg class="fig" viewBox="0 0 640 270" role="img" aria-label="Les trois niveaux d'un réseau industriel">
          ${L.map(l => h`<g key=${l.k} class=${'lvl' + (sel && sel !== l.k ? ' dim' : '')} onClick=${() => onSel(l.k)}>
            <rect x=${320 - l.w / 2} y=${l.y} width=${l.w} height="66" rx="8" fill=${l.c} />
            <text x="320" y=${l.y + 28} textAnchor="middle" fontSize="15" fontWeight="600" class="white">${l.label}</text>
            <text x="320" y=${l.y + 50} textAnchor="middle" fontSize="12" class="white">${l.sub}</text>
          </g>`)}
          <text x="320" y="262" textAnchor="middle" fontSize="12" class="muted">Clique sur un niveau</text>
        </svg>`;
      }

      function FigEtoile() {
        const P = [[120, 60], [520, 60], [120, 220], [520, 220]];
        return h`<svg class="fig" viewBox="0 0 640 280" role="img" aria-label="Topologie en étoile">
          ${P.map(([x, y], i) => h`<g key=${i}><line class="wire" x1="320" y1="140" x2=${x} y2=${y}/><rect class="plc" x=${x - 35} y=${y - 20} width="70" height="40" rx="6"/><text x=${x} y=${y + 5} textAnchor="middle" fontSize="12" class="white">API ${i + 1}</text></g>`)}
          <rect class="sw" x="260" y="115" width="120" height="50" rx="8"/><text x="320" y="145" textAnchor="middle" fontSize="13" fontWeight="600" class="white">Commutateur</text>
          <text x="320" y="268" textAnchor="middle" fontSize="12" class="muted">Ethernet industriel : tout passe par le commutateur (switch)</text>
        </svg>`;
      }
      function FigBus() {
        return h`<svg class="fig" viewBox="0 0 640 280" role="img" aria-label="Topologie en bus">
          <line class="wire" x1="60" y1="160" x2="580" y2="160" strokeWidth="4"/>
          <rect class="hl" x="48" y="150" width="12" height="20" rx="2"/><rect class="hl" x="580" y="150" width="12" height="20" rx="2"/>
          <text x="54" y="195" textAnchor="middle" fontSize="11" class="muted">Résistance</text><text x="54" y="208" textAnchor="middle" fontSize="11" class="muted">de fin de ligne</text>
          <text x="586" y="195" textAnchor="middle" fontSize="11" class="muted">Résistance</text><text x="586" y="208" textAnchor="middle" fontSize="11" class="muted">de fin de ligne</text>
          ${[130, 260, 390, 520].map((x, i) => h`<g key=${i}><line class="wire" x1=${x} y1="160" x2=${x} y2="95"/><rect class="plc" x=${x - 35} y="55" width="70" height="40" rx="6"/><text x=${x} y="80" textAnchor="middle" fontSize="12" class="white">Nœud ${i + 1}</text><circle cx=${x} cy="160" r="5" fill="currentColor"/></g>`)}
          <text x="320" y="250" textAnchor="middle" fontSize="12" class="muted">Un seul tronc (trunk) ; chaque nœud se branche par une dérivation (drop)</text>
        </svg>`;
      }
      function FigChaine() {
        return h`<svg class="fig" viewBox="0 0 640 280" role="img" aria-label="Topologie en chaîne (daisy-chain)">
          ${[90, 245, 400, 555].map((x, i) => h`<g key=${i}>
            ${i < 3 && h`<line class="wire" x1=${x + 35} y1="140" x2=${x + 155 - 35} y2="140" strokeWidth="3"/>`}
            <rect class="dev" x=${x - 35} y="115" width="70" height="50" rx="6"/><text x=${x} y="145" textAnchor="middle" fontSize="12" class="white">Appareil ${i + 1}</text>
          </g>`)}
          <text x="320" y="230" textAnchor="middle" fontSize="12" class="muted">Le câble passe d'un appareil au suivant (bus de terrain, PROFIBUS, Fieldbus)</text>
        </svg>`;
      }

      function FigJeton() {
        return h`<svg class="fig" viewBox="0 0 640 170" role="img" aria-label="Passage de jeton">
          <line class="wire" x1="90" y1="60" x2="570" y2="60" strokeWidth="3"/>
          ${[90, 330, 570].map((x, i) => h`<g key=${i}><rect class="plc" x=${x - 40} y="80" width="80" height="40" rx="6"/><text x=${x} y="105" textAnchor="middle" fontSize="12" class="white">Nœud ${i + 1}</text><line class="wire" x1=${x} y1="60" x2=${x} y2="80"/></g>`)}
          <circle class="token hl" r="10"/>
          <text x="330" y="150" textAnchor="middle" fontSize="12" class="muted">Le jeton (orange) circule : seul celui qui le tient peut émettre</text>
        </svg>`;
      }
      function FigCollision() {
        return h`<svg class="fig" viewBox="0 0 640 170" role="img" aria-label="Détection de collision">
          <line class="wire" x1="90" y1="60" x2="570" y2="60" strokeWidth="3"/>
          ${[90, 330, 570].map((x, i) => h`<g key=${i}><rect class="plc" x=${x - 40} y="80" width="80" height="40" rx="6"/><text x=${x} y="105" textAnchor="middle" fontSize="12" class="white">Nœud ${i + 1}</text><line class="wire" x1=${x} y1="60" x2=${x} y2="80"/></g>`)}
          <line class="wire flow" x1="90" y1="45" x2="300" y2="45" stroke="#2563eb" strokeWidth="3"/>
          <line class="wire flow" x1="570" y1="45" x2="360" y2="45" stroke="#16a34a" strokeWidth="3"/>
          <circle class="hl blink" cx="330" cy="45" r="12"/><text x="330" y="25" textAnchor="middle" fontSize="12" fontWeight="600">Collision !</text>
          <text x="330" y="150" textAnchor="middle" fontSize="12" class="muted">Ethernet : on écoute, on émet si c'est libre ; en cas de collision, on attend un délai aléatoire et on recommence</text>
        </svg>`;
      }
      function FigPolling() {
        return h`<svg class="fig" viewBox="0 0 640 190" role="img" aria-label="Maître/esclave (interrogation)">
          <rect class="sw" x="270" y="15" width="100" height="40" rx="6"/><text x="320" y="40" textAnchor="middle" fontSize="12" fontWeight="600" class="white">Maître</text>
          ${[120, 320, 520].map((x, i) => h`<g key=${i}>
            <line class="wire flow" x1="320" y1="55" x2=${x} y2="120"/>
            <rect class="plc" x=${x - 45} y="120" width="90" height="40" rx="6"/><text x=${x} y="145" textAnchor="middle" fontSize="12" class="white">Esclave ${i + 1}</text>
          </g>`)}
          <text x="320" y="182" textAnchor="middle" fontSize="12" class="muted">Le maître interroge (poll) chaque esclave à tour de rôle ; les esclaves ne parlent jamais entre eux</text>
        </svg>`;
      }

      function FigSerie() {
        const bits = [1, 0, 1, 1, 0, 0, 1, 0];
        return h`<svg class="fig" viewBox="0 0 640 230" role="img" aria-label="Parallèle contre série">
          <text x="160" y="22" textAnchor="middle" fontWeight="600" fontSize="14">Parallèle : 8 fils, tout d'un coup</text>
          ${bits.map((b, i) => h`<g key=${i}><line class="wire" x1="70" y1=${45 + i * 18} x2="250" y2=${45 + i * 18}/><text x="56" y=${49 + i * 18} textAnchor="middle" fontSize="12" fontWeight="600">${b}</text></g>`)}
          <text x="480" y="22" textAnchor="middle" fontWeight="600" fontSize="14">Série : 1 fil, un bit après l'autre</text>
          <line class="wire" x1="360" y1="110" x2="600" y2="110" strokeWidth="2"/>
          ${bits.map((b, i) => h`<g key=${i}><rect x=${372 + i * 28} y="92" width="22" height="22" rx="3" fill=${b ? '#2563eb' : 'none'} stroke="currentColor"/><text x=${383 + i * 28} y="108" textAnchor="middle" fontSize="12" fontWeight="600" fill=${b ? '#fff' : 'currentColor'}>${b}</text></g>`)}
          <text x="480" y="150" textAnchor="middle" fontSize="12" class="muted">bit de départ → 8 bits de données → parité → bit d'arrêt</text>
          <text x="320" y="210" textAnchor="middle" fontSize="12" class="muted">La série est plus lente, mais va beaucoup plus loin avec moins de fils : c'est elle qu'on utilise dans les réseaux.</text>
        </svg>`;
      }

      function FigScada() {
        return h`<svg class="fig" viewBox="0 0 640 230" role="img" aria-label="Système SCADA">
          <rect class="sw" x="40" y="80" width="130" height="70" rx="8"/><text x="105" y="110" textAnchor="middle" fontSize="13" fontWeight="600" class="white">Ordinateur hôte</text><text x="105" y="130" textAnchor="middle" fontSize="11" class="white">logiciel SCADA / IHM</text>
          ${[40, 115, 190].map((y, i) => h`<g key=${i}>
            <line class="wire flow" x1="170" y1="115" x2="280" y2=${y}/>
            <rect class="plc" x="280" y=${y - 18} width="70" height="36" rx="6"/><text x="315" y=${y + 5} textAnchor="middle" fontSize="12" class="white">API ${i + 1}</text>
            <line class="wire" x1="350" y1=${y} x2="430" y2=${y}/>
            <text x="440" y=${y + 4} fontSize="12">E/S → appareils de terrain</text>
          </g>`)}
          <text x="105" y="180" textAnchor="middle" fontSize="11" class="muted">tendances, alarmes,</text><text x="105" y="194" textAnchor="middle" fontSize="11" class="muted">recettes, historique</text>
        </svg>`;
      }

      // ---------- Données ----------
      const NIVEAUX = {
        dev: {t: 'Niveau terrain', d: 'Les capteurs et actionneurs de la machine : boutons, fins de course, cellules photoélectriques, électrovannes, variateurs. Messages très courts et très fréquents (un bit ou quelques octets). Réseaux typiques : DeviceNet, PROFIBUS-DP, AS-i, IO-Link.'},
        ctrl: {t: 'Niveau contrôle', d: 'Les automates (API/PLC), contrôleurs de robots et IHM. On y partage des entrées/sorties et des données de programme entre contrôleurs, en temps réel. Réseaux typiques : EtherNet/IP, PROFINET, ControlNet, DH+.'},
        info: {t: 'Niveau information', d: "Le réseau d'entreprise : production, planification, ventes, gestion. On y remonte les données de l'usine (quantités, arrêts, qualité). Réseau typique : Ethernet TCP/IP, le même que les bureaux et Internet."},
      };

      const SUPPORTS = [
        {n: 'Paire torsadée', b: 'blue', p: ['Peu coûteuse, facile à poser', 'Blindée : bonne immunité au bruit', 'La plus courante (RS-485, Ethernet, DeviceNet)'], m: ['Distance limitée (quelques centaines de mètres)']},
        {n: 'Câble coaxial', b: 'cyan', p: ['Bonne immunité, bon débit', 'Longues distances'], m: ['Plus rigide, plus cher', 'Moins utilisé aujourd’hui']},
        {n: 'Fibre optique', b: 'green', p: ['Aucune interférence électromagnétique', 'Très haut débit, ~10 km sans répéteur', 'Isolation galvanique totale'], m: ['Coût, connecteurs délicats', 'Rayon de courbure à respecter']},
        {n: 'Sans fil (Wi-Fi, radio)', b: 'orange', p: ['Pas de câble : machines mobiles, sites éloignés'], m: ['Fiabilité et sécurité à surveiller', 'Délais variables : à éviter pour la sécurité']},
      ];

      const TOPOS = {
        etoile: {fig: FigEtoile, p: ['On ajoute ou retire un API sans perturber le réseau', 'Communication bidirectionnelle rapide avec le commutateur', 'Facile à diagnostiquer : un câble = un appareil'], m: ['Si le commutateur tombe, tout le réseau tombe', 'Beaucoup de câble : chaque appareil revient au centre']},
        bus: {fig: FigBus, p: ['Le moins de câble de toutes les topologies', 'Aucune station ne commande les autres : tous égaux', 'Ajout ou retrait d’une station sans grande reconfiguration'], m: ['Une coupure du tronc affecte plusieurs nœuds', 'Les deux extrémités doivent avoir une résistance de terminaison', 'Il faut une règle pour partager la ligne (voir section 5)']},
        chaine: {fig: FigChaine, p: ['Très simple à câbler d’un appareil à l’autre', 'Courant sur les bus de terrain'], m: ['Un appareil débranché peut couper la suite (sauf connecteurs prévus pour)', 'Longueur totale limitée']},
      };

      const ACCES = {
        jeton: {fig: FigJeton, t: 'Passage de jeton (token passing)', d: 'Un petit paquet, le jeton, passe de nœud en nœud. Un nœud n’émet que lorsqu’il tient le jeton, puis le passe au suivant. Pas de collision possible, temps de réponse prévisible. Exemples : Data Highway Plus, ControlNet.'},
        collision: {fig: FigCollision, t: 'Détection de collision (Ethernet)', d: 'Chaque nœud écoute la ligne et émet seulement si elle est libre. Si deux nœuds parlent en même temps, la collision est détectée : chacun attend un délai aléatoire et réessaie. Simple et rapide, mais le délai n’est pas garanti — avec les commutateurs modernes, les collisions ont pratiquement disparu.'},
        polling: {fig: FigPolling, t: 'Interrogation (maître / esclave)', d: 'Un seul maître commande tout : il envoie les données aux esclaves et, quand il veut une information, il interroge l’esclave concerné et attend sa réponse. Rien ne circule sans le maître ; deux esclaves ne se parlent jamais directement. Exemples : Modbus RTU, PROFIBUS-DP, AS-i.'},
      };

      const RS = [
        {id: 1, norme: 'RS-232', liaison: '1 appareil ↔ 1 appareil', dist: '≈ 15 m (50 pi)', bruit: 'Faible', usage: 'Port de programmation, imprimante, lecteur code-barres'},
        {id: 2, norme: 'RS-422', liaison: '1 maître → plusieurs récepteurs', dist: '≈ 500 m (1650 pi)', bruit: 'Élevée (différentiel)', usage: 'Liaisons longues point à multipoint'},
        {id: 3, norme: 'RS-485', liaison: 'Multipoint (jusqu’à 32 nœuds et plus)', dist: '≈ 200 m (650 pi) à 1200 m selon débit', bruit: 'Élevée (différentiel)', usage: 'Modbus RTU, PROFIBUS-DP, variateurs'},
      ];
      const RS_COLS = [
        {key: 'norme', header: 'Norme', renderCell: r => h`<${Text} weight="semibold">${r.norme}</${Text}>`},
        {key: 'liaison', header: 'Type de liaison'},
        {key: 'dist', header: 'Distance typique'},
        {key: 'bruit', header: 'Immunité au bruit'},
        {key: 'usage', header: 'Usages courants'},
      ];

      const PROTOS = [
        {id: 1, nom: 'Modbus RTU / TCP', niv: 'Terrain / contrôle', support: 'RS-485 ou Ethernet', acces: 'Maître/esclave', note: 'Ouvert et gratuit, le plus répandu ; très simple'},
        {id: 2, nom: 'DeviceNet', niv: 'Terrain', support: 'Câble 4 fils (données + 24 V), CAN', acces: 'Producteur/consommateur (CIP)', note: 'Jusqu’à 64 nœuds ; l’alimentation passe dans le câble'},
        {id: 3, nom: 'ControlNet', niv: 'Contrôle', support: 'Coaxial, média redondant possible', acces: 'Jeton (déterministe)', note: 'Temps de livraison prévisible et répétable ; CIP'},
        {id: 4, nom: 'EtherNet/IP', niv: 'Contrôle / information', support: 'Ethernet (paire torsadée, fibre)', acces: 'Commutateurs, CIP', note: 'Même réseau que les bureaux ; plug and play entre fabricants'},
        {id: 5, nom: 'PROFIBUS-DP', niv: 'Terrain', support: 'RS-485 ou fibre, jusqu’à 12 Mbit/s', acces: 'Maître/esclave', note: 'Standard Siemens très répandu ; jusqu’à 1200 m'},
        {id: 6, nom: 'PROFINET', niv: 'Contrôle / terrain', support: 'Ethernet', acces: 'Commutateurs, temps réel', note: 'Successeur Ethernet de PROFIBUS (monde Siemens)'},
        {id: 7, nom: 'Data Highway Plus (DH+)', niv: 'Contrôle', support: 'Paire torsadée blindée', acces: 'Jeton, pair à pair', note: 'Propriétaire Allen-Bradley (SLC 5/04, PLC-5) ; ancien'},
        {id: 8, nom: 'Fieldbus (Foundation)', niv: 'Terrain (procédé)', support: 'Paire torsadée, chaîne', acces: 'Planifié', note: 'Instrumentation de procédé : vannes et débitmètres intelligents'},
        {id: 9, nom: 'HART', niv: 'Terrain (procédé)', support: 'Boucle 4–20 mA existante', acces: 'Maître/esclave', note: 'Signal numérique (1,2 / 2,2 kHz) superposé au 4–20 mA'},
        {id: 10, nom: 'SERCOS', niv: 'Mouvement', support: 'Fibre optique / Ethernet', acces: 'Cyclique temps réel', note: 'Servomoteurs multi-axes ; remplace jusqu’à 18 fils par axe'},
      ];
      const PROTO_COLS = [
        {key: 'nom', header: 'Protocole', renderCell: r => h`<${Text} weight="semibold">${r.nom}</${Text}>`},
        {key: 'niv', header: 'Niveau'},
        {key: 'support', header: 'Support physique'},
        {key: 'acces', header: 'Accès au réseau'},
        {key: 'note', header: 'À retenir'},
      ];

      const QUIZ = [
        {q: 'Quel est le principal avantage d’un bus de terrain par rapport au câblage conventionnel ?', c: ['Les capteurs coûtent moins cher', 'Un seul câble remplace des dizaines de fils vers l’armoire', 'Le programme ladder est plus court'], b: 1},
        {q: 'À quel niveau du réseau industriel se trouvent les capteurs et les électrovannes ?', c: ['Niveau information', 'Niveau contrôle', 'Niveau terrain (device)'], b: 2},
        {q: 'Dans une topologie en étoile, que se passe-t-il si le commutateur tombe en panne ?', c: ['Seul un API est touché', 'Tout le réseau est en panne', 'Les API passent en mode bus automatiquement'], b: 1},
        {q: 'Pourquoi faut-il des résistances de terminaison aux deux bouts d’un bus ?', c: ['Pour alimenter les nœuds', 'Pour éviter les réflexions du signal en bout de ligne', 'Pour compter le nombre de nœuds'], b: 1},
        {q: 'Dans un réseau maître/esclave, deux esclaves veulent échanger une donnée. Comment ?', c: ['Directement entre eux', 'Impossible : tout passe par le maître', 'En envoyant le jeton'], b: 1},
        {q: 'Quelle norme série permet plusieurs appareils sur la même paire de fils, avec une bonne immunité au bruit ?', c: ['RS-232', 'RS-485', 'USB'], b: 1},
        {q: 'Quel support de transmission est totalement insensible aux parasites électromagnétiques ?', c: ['Paire torsadée blindée', 'Câble coaxial', 'Fibre optique'], b: 2},
        {q: 'Qu’est-ce qu’un protocole ?', c: ['Le câble qui relie deux appareils', 'L’ensemble des règles que deux appareils doivent suivre pour se comprendre', 'Le logiciel de programmation de l’API'], b: 1},
      ];

      // ---------- Composants ----------
      function Question({n, data}) {
        const [rep, setRep] = useState(null);
        const ok = rep === data.b;
        return h`
          <${Card} elevation="low">
            <${Stack} gap=${3} align="start">
              <${HStack} gap=${2} align="center">
                <${Badge} variant="info" label=${'Question ' + n} />
                ${rep !== null && h`<${Badge} variant=${ok ? 'success' : 'error'} label=${ok ? 'Bonne réponse' : 'À revoir'} />`}
              </${HStack}>
              <${Text}>${data.q}</${Text}>
              <${HStack} gap=${2} wrap="wrap">
                ${data.c.map((c, i) => h`<${Button} key=${i} label=${c} variant=${rep === i && i === data.b ? 'primary' : 'secondary'} onClick=${() => setRep(i)} />`)}
              </${HStack}>
            </${Stack}>
          </${Card}>`;
      }

      function App() {
        const [niv, setNiv] = useState(null);
        const [topo, setTopo] = useState('etoile');
        const [acces, setAcces] = useState('jeton');
        const T = TOPOS[topo], A = ACCES[acces];
        return h`
          <${Theme} theme=${neutralTheme} mode="system">
            <${Stack} padding=${6} gap=${8} align="stretch" style=${{maxWidth: 980, margin: '0 auto'}}>

              <${Stack} gap=${2} align="start">
                <${HStack} gap=${2} wrap="wrap"><${Badge} variant="purple" label="Automates programmables" /><${Badge} variant="neutral" label="243.D0 — Cégep du Vieux Montréal" /></${HStack}>
                <${Heading} level=${1}>Les réseaux de communication dans les automates (PLC)</${Heading}>
                <${Text} type="large" color="secondary">Comment les API se parlent entre eux, avec les capteurs et avec l'usine — et pourquoi on ne tire plus un fil par capteur.</${Text}>
              </${Stack}>

              <${Banner} status="info" title="Ce que tu dois retenir à la fin" description="Les deux types de liaison, les trois niveaux d'un réseau industriel, les topologies, les trois méthodes d'accès, la différence RS-232 / RS-485 et le rôle d'un protocole." collapsible=${false} />

              <${Stack} gap=${4} align="stretch">
                <${Titre} n=${1}>Pourquoi un réseau ?</${Titre}>
                <${Text}>Au début, chaque bouton, chaque capteur, chaque électrovanne avait son propre fil jusqu'à une carte d'entrées/sorties dans l'armoire. Sur une vraie machine, ça fait des faisceaux de centaines de fils : long à installer, difficile à dépanner. Un réseau remplace tout ça par <b>un seul câble</b> sur lequel les appareils se branchent et <b>échangent des messages</b>.</${Text}>
                <${Card} elevation="low"><${FigCablage} /></${Card}>
                <${Grid} columns=${{minWidth: 280}} gap=${3}>
                  <${Card} variant="blue"><${Stack} gap=${2} align="start"><${Heading} level=${3}>Liaison point à point</${Heading}><${Text}>Un câble série entre <b>deux</b> appareils : l'API et une imprimante, un terminal opérateur, un variateur ou un autre API. Simple, mais un câble par partenaire.</${Text}></${Stack}></${Card}>
                  <${Card} variant="green"><${Stack} gap=${2} align="start"><${Heading} level=${3}>Liaison réseau (LAN)</${Heading}><${Text}><b>Plusieurs</b> appareils sur un même support, sur le site de l'usine. Les API partagent leurs états, un poste central surveille tout, on télécharge les programmes à distance et plusieurs API travaillent ensemble.</${Text}></${Stack}></${Card}>
                </${Grid}>
              </${Stack}>

              <${Stack} gap=${4} align="stretch">
                <${Titre} n=${2}>Les trois niveaux d'un réseau industriel</${Titre}>
                <${Text}>On ne met pas une cellule photoélectrique et le serveur de la comptabilité sur le même réseau : les besoins ne sont pas les mêmes. On organise donc les réseaux d'usine en pyramide.</${Text}>
                <${Grid} columns=${{minWidth: 300}} gap=${3} align="start">
                  <${Card} elevation="low"><${FigPyramide} sel=${niv} onSel=${k => setNiv(k === niv ? null : k)} /></${Card}>
                  <${Card} elevation="low" minHeight=${200}><${Stack} gap=${2} align="start">
                    <${Heading} level=${3}>${niv ? NIVEAUX[niv].t : 'Choisis un niveau'}</${Heading}>
                    <${Text}>${niv ? NIVEAUX[niv].d : 'Plus on descend dans la pyramide, plus les messages sont courts, nombreux et urgents. Plus on monte, plus ils sont gros et moins pressés.'}</${Text}>
                  </${Stack}></${Card}>
                </${Grid}>
              </${Stack}>

              <${Stack} gap=${4} align="stretch">
                <${Titre} n=${3}>Les supports de transmission</${Titre}>
                <${Text}>Le support, c'est le « tuyau » par lequel passent les bits. Le débit se mesure en bits par seconde (bit/s ou « baud »). Chaque support a ses forces et ses limites ; quand un câble est trop long, le signal s'affaiblit (atténuation) et il faut un <b>répéteur</b>.</${Text}>
                <${Grid} columns=${{minWidth: 220}} gap=${3} align="stretch">
                  ${SUPPORTS.map(s => h`<${Card} key=${s.n} elevation="low"><${Stack} gap=${2} align="start">
                    <${Badge} variant=${s.b} label=${s.n} />
                    ${s.p.map((t, i) => h`<${Text} key=${'p' + i}>✓ ${t}</${Text}>`)}
                    ${s.m.map((t, i) => h`<${Text} key=${'m' + i} color="secondary">✗ ${t}</${Text}>`)}
                  </${Stack}></${Card}>`)}
                </${Grid}>
              </${Stack}>

              <${Stack} gap=${4} align="stretch">
                <${Titre} n=${4}>Les topologies : comment on branche les nœuds</${Titre}>
                <${Text}>Chaque appareil branché sur le réseau est un <b>nœud</b> (ou station). La topologie, c'est la forme que dessinent les câbles entre les nœuds.</${Text}>
                <${TabList} value=${topo} onChange=${setTopo} hasDivider>
                  <${Tab} value="etoile" label="Étoile" />
                  <${Tab} value="bus" label="Bus" />
                  <${Tab} value="chaine" label="Chaîne (daisy-chain)" />
                </${TabList}>
                <${Grid} columns=${{minWidth: 300}} gap=${3} align="start">
                  <${Card} elevation="low"><${T.fig} /></${Card}>
                  <${Stack} gap=${3} align="start">
                    <${Card} variant="green"><${Stack} gap=${1} align="start"><${Text} weight="semibold">Avantages</${Text}><${Puces} items=${T.p} /></${Stack}></${Card}>
                    <${Card} variant="orange"><${Stack} gap=${1} align="start"><${Text} weight="semibold">Inconvénients</${Text}><${Puces} items=${T.m} /></${Stack}></${Card}>
                  </${Stack}>
                </${Grid}>
              </${Stack}>

              <${Stack} gap=${4} align="stretch">
                <${Titre} n=${5}>Qui a le droit de parler ? Les méthodes d'accès</${Titre}>
                <${Text}>Sur un bus, tout le monde partage la même ligne. S'il n'y a pas de règle, deux nœuds parlent en même temps et les messages se brouillent. La <b>méthode d'accès</b>, c'est la règle de politesse du réseau.</${Text}>
                <${TabList} value=${acces} onChange=${setAcces} hasDivider>
                  <${Tab} value="jeton" label="Jeton" />
                  <${Tab} value="collision" label="Collision (Ethernet)" />
                  <${Tab} value="polling" label="Maître / esclave" />
                </${TabList}>
                <${Card} elevation="low"><${Stack} gap=${3} align="stretch">
                  <${A.fig} />
                  <${Heading} level=${3}>${A.t}</${Heading}>
                  <${Text}>${A.d}</${Text}>
                </${Stack}></${Card}>
                <${Grid} columns=${{minWidth: 280}} gap=${3}>
                  <${Card} variant="muted"><${Stack} gap=${1} align="start"><${Text} weight="semibold">Pair à pair</${Text}><${Text}>Tous les nœuds sont égaux et peuvent prendre l'initiative (jeton ou Ethernet). Communication en <b>duplex intégral</b> : les deux sens en même temps.</${Text}></${Stack}></${Card}>
                  <${Card} variant="muted"><${Stack} gap=${1} align="start"><${Text} weight="semibold">Maître / esclave</${Text}><${Text}>Un seul nœud décide. Communication en <b>semi-duplex</b> : les deux sens, mais un à la fois. Très prévisible, facile à dépanner.</${Text}></${Stack}></${Card}>
                </${Grid}>
              </${Stack}>

              <${Stack} gap=${4} align="stretch">
                <${Titre} n=${6}>Série ou parallèle ? Et les normes RS</${Titre}>
                <${Card} elevation="low"><${FigSerie} /></${Card}>
                <${Text}>Les ports série des API suivent des normes électriques « RS » (<i>recommended standard</i>) qui fixent les tensions, les connecteurs et les distances. Le RS-232 relie un ordinateur à un contrôleur ; le RS-422 et le RS-485 utilisent des signaux différentiels, bien plus résistants au bruit de l'usine, et acceptent plusieurs appareils.</${Text}>
                <${Table} data=${RS} columns=${RS_COLS} idKey="id" hasHover density="balanced" />
              </${Stack}>

              <${Stack} gap=${4} align="stretch">
                <${Titre} n=${7}>Les protocoles : parler la même langue</${Titre}>
                <${Text}>Un <b>protocole</b> est l'ensemble des règles que deux appareils doivent suivre pour se comprendre : comment les données sont découpées, codées, adressées, vérifiées. Deux appareils sur le même câble mais avec des protocoles différents ne se parlent pas — comme deux personnes de langues différentes. Autrefois chaque fabricant avait le sien (on était prisonnier d'une marque) ; aujourd'hui la tendance est aux <b>protocoles ouverts</b>, normalisés. Une <b>passerelle</b> (gateway) traduit d'un protocole à l'autre.</${Text}>
                <${Collapsible} trigger="Le modèle OSI en deux mots" defaultIsOpen=${false}>
                  <${Stack} gap=${2} align="start" padding=${3}>
                    <${Text}>L'ISO a défini un modèle en <b>7 couches</b> qui décrit toutes les étapes qu'une donnée traverse pour aller d'un appareil à un autre : du signal électrique sur le câble (couche 1, physique) jusqu'à l'application qui lit la valeur (couche 7). Les protocoles industriels se décrivent par rapport à ces couches : par exemple DeviceNet, ControlNet et EtherNet/IP partagent la même couche application (CIP) sur des supports physiques différents.</${Text}>
                  </${Stack}>
                </${Collapsible}>
                <${Table} data=${PROTOS} columns=${PROTO_COLS} idKey="id" hasHover isStriped density="compact" />
                <${Banner} status="success" title="Repère pratique pour le labo" description="Un variateur ou un IHM qui parle Modbus RTU : paire torsadée RS-485, un maître (l'API), des esclaves avec chacun une adresse, résistance de terminaison aux deux bouts." collapsible=${false} />
              </${Stack}>

              <${Stack} gap=${4} align="stretch">
                <${Titre} n=${8}>Et au-dessus : le SCADA</${Titre}>
                <${Text}>Quand on relie plusieurs API à un ordinateur hôte qui les surveille, on obtient un système <b>SCADA</b> (supervision et acquisition de données). Les API gardent le contrôle en temps réel ; l'ordinateur affiche les écrans, enregistre les tendances, gère les alarmes et les recettes. C'est le réseau qui rend ça possible.</${Text}>
                <${Card} elevation="low"><${FigScada} /></${Card}>
              </${Stack}>

              <${Stack} gap=${4} align="stretch">
                <${Titre} n=${9}>Vérifie ta compréhension</${Titre}>
                ${QUIZ.map((d, i) => h`<${Question} key=${i} n=${i + 1} data=${d} />`)}
              </${Stack}>

              <${Collapsible} trigger="Petit glossaire" defaultIsOpen=${false}>
                <${Stack} gap=${1} align="start" padding=${3}>
                  ${[['Nœud', 'tout appareil branché sur le réseau.'], ['Débit (baud, bit/s)', 'nombre de bits transmis par seconde.'], ['Atténuation', 'affaiblissement du signal avec la distance ; un répéteur le régénère.'], ['Terminaison', 'résistance en bout de bus qui empêche les réflexions.'], ['Déterminisme', 'capacité à garantir quand une donnée arrivera.'], ['Passerelle', 'appareil qui traduit un protocole vers un autre.'], ['CIP', 'Common Industrial Protocol, la couche commune de DeviceNet, ControlNet et EtherNet/IP.'], ['Duplex intégral / semi-duplex', 'les deux sens en même temps / un sens à la fois.']].map(([m, d]) => h`<${Text} key=${m}><b>${m}</b> — ${d}</${Text}>`)}
                </${Stack}>
              </${Collapsible}>

              <${Divider} />
              <${Text} type="supporting" color="secondary">Bassam Kattan — Cégep du Vieux Montréal, 243.D0. Contenu adapté de F. D. Petruzella, <i>Programmable Logic Controllers</i>, chapitre 14 (« Process Control, Network Systems, and SCADA »), sections 14.6–14.7. Figures originales.</${Text}>
            </${Stack}>
          </${Theme}>`;
      }
      createRoot(document.getElementById('root')).render(h`<${App} />`);
    </script>
  </body>
</html>
